name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release FMM (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        working-directory: FactorioModManagerMac
        run: swift test

      - name: Build FMM App Bundles (Apple Silicon, Intel)
        env:
          FMM_MIN_SDK: "26"
        run: |
          cd FactorioModManagerMac
          chmod +x build_app.sh
          FMM_ARCH=arm64 ./build_app.sh
          ditto -c -k --keepParent FMM.app ../FMM-macOS-AppleSilicon.zip
          FMM_ARCH=x86_64 ./build_app.sh
          ditto -c -k --keepParent FMM.app ../FMM-macOS-Intel.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            FMM-macOS-AppleSilicon.zip
            FMM-macOS-Intel.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

