name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build standalone binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: fmm.exe
            asset_name: fmm-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: fmm
            asset_name: fmm-linux-x64
          - os: macos-13
            artifact_name: fmm
            asset_name: fmm-macos-intel
          - os: macos-14
            artifact_name: fmm
            asset_name: fmm-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Standalone Binary
        run: |
          pyinstaller --onefile --clean --name fmm fmm.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fmm-windows-x64.exe/fmm.exe
            fmm-linux-x64/fmm
            fmm-macos-intel/fmm
            fmm-macos-arm64/fmm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
